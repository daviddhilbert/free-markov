name = "free_markov"
version = "0.1.0"
description = "Formalization of Yimu Yin's A graphical construction of free Markov categories"
defaultTargets = ["FreeMarkovStage0", "FreeMarkovStage1", "FreeMarkovStage2", "FreeMarkovStage3", "FreeMarkovStage4", "FreeMarkovStage5", "FreeMarkovStage6", "FreeMarkovStage7", "FreeMarkovStage8"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# One library per stage; each stage's sources live in its own folder.
# Module names carry the stage (`FreeMarkov.Stage0.*`) so that the libraries
# never claim each other's modules.

[[lean_lib]]
name = "FreeMarkovStage0"
srcDir = "stage 0"
roots = ["FreeMarkov.Stage0"]
globs = ["FreeMarkov.Stage0", "FreeMarkov.Stage0.+"]

[[lean_lib]]
name = "FreeMarkovStage1"
srcDir = "stage 1"
roots = ["FreeMarkov.Stage1"]
globs = ["FreeMarkov.Stage1", "FreeMarkov.Stage1.+"]

[[lean_lib]]
name = "FreeMarkovStage2"
srcDir = "stage 2"
roots = ["FreeMarkov.Stage2"]
globs = ["FreeMarkov.Stage2", "FreeMarkov.Stage2.+"]

[[lean_lib]]
name = "FreeMarkovStage3"
srcDir = "stage 3"
roots = ["FreeMarkov.Stage3"]
globs = ["FreeMarkov.Stage3", "FreeMarkov.Stage3.+"]

[[lean_lib]]
name = "FreeMarkovStage4"
srcDir = "stage 4"
roots = ["FreeMarkov.Stage4"]
globs = ["FreeMarkov.Stage4", "FreeMarkov.Stage4.+"]

[[lean_lib]]
name = "FreeMarkovStage5"
srcDir = "stage 5"
roots = ["FreeMarkov.Stage5"]
globs = ["FreeMarkov.Stage5", "FreeMarkov.Stage5.+"]

[[lean_lib]]
name = "FreeMarkovStage6"
srcDir = "stage 6"
roots = ["FreeMarkov.Stage6"]
globs = ["FreeMarkov.Stage6", "FreeMarkov.Stage6.+"]

[[lean_lib]]
name = "FreeMarkovStage7"
srcDir = "stage 7"
roots = ["FreeMarkov.Stage7"]
globs = ["FreeMarkov.Stage7", "FreeMarkov.Stage7.+"]

[[lean_lib]]
name = "FreeMarkovStage8"
srcDir = "stage 8"
roots = ["FreeMarkov.Stage8"]
globs = ["FreeMarkov.Stage8", "FreeMarkov.Stage8.+"]
